<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Libus - 3D Vertical Performance</title>
    <style>
        /* =========================================================
           SISTEMA DE DISEÑO - VIBRANTE, CLARO Y 3D INDUSTRIAL
           ========================================================= */
        :root {
            --primary: #e6005a;
            --primary-glow: rgba(230, 0, 90, 0.15);
            --bg-light: #f4f7f6; /* Fondo claro para Yodeck */
            --card-bg: #ffffff; /* Tarjetas blancas de alto contraste */
            --border-color: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            
            --gold-light: #fef08a;
            --gold-dark: #b45309;
            --silver-light: #f1f5f9;
            --silver-dark: #475569;
            --bronze-light: #ffedd5;
            --bronze-dark: #9a3412;
            
            --team-a: #0284c7; /* Azul Dilan */
            --team-b: #ea580c; /* Naranja Miguel */
            --team-c: #10b981; /* Verde Nilson */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            /* Patrón de malla de fábrica claro y sutil */
            background-image: 
                radial-gradient(rgba(0,0,0,0.015) 1px, transparent 1px),
                linear-gradient(to right, rgba(230,0,90,0.008) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-dark);
            padding: 2.5vh 2.5vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 1.5vh;
            margin-bottom: 2vh;
            height: 8vh;
            flex-shrink: 0;
            background: linear-gradient(90deg, rgba(230, 0, 90, 0.04) 0%, transparent 100%);
            border-radius: 8px;
            padding: 0.5vh 1.5vw;
        }
        .logo { height: 100%; max-height: 45px; object-fit: contain; }
        .title-box { text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .title { margin: 0; font-size: 3.5vh; font-weight: 900; color: #000; letter-spacing: 1px; text-transform: uppercase; line-height: 1; }
        .subtitle { color: var(--primary); font-weight: bold; font-size: 1.8vh; margin-top: 4px; text-transform: uppercase; letter-spacing: 3px; }
        .clock { font-size: 2.4vh; font-weight: bold; color: var(--text-dark); background: #ffffff; padding: 0.8vh 1.5vw; border-radius: 30px; letter-spacing: 2px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        /* GRILLA 4 CUADRANTES */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2.5vh 2vw;
            flex-grow: 1;
            height: calc(100vh - 12vh);
        }

        /* CUADRANTE */
        .quadrant {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            border-top: 6px solid var(--primary);
            box-shadow: 0 10px 25px rgba(0,0,0,0.03), 0 4px 10px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 2vh 1.5vw;
            position: relative;
        }

        .q-header {
            text-align: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 1vh;
            margin-bottom: 1.5vh;
            flex-shrink: 0;
        }
        .q-title { font-size: 2.5vh; font-weight: 900; color: #000; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }
        .q-subtitle { font-size: 1.3vh; color: var(--text-muted); margin-top: 3px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }

        .q-body {
            flex-grow: 1;
            display: flex; 
            flex-direction: row; 
            justify-content: space-evenly;
            align-items: flex-end; /* Alinea los gráficos al suelo */
            width: 100%;
            gap: 1vw;
            padding-top: 1.5vh;
        }

        /* =========================================================
           COLUMNAS VERTICALES 3D (3D BAR CHART)
           ========================================================= */
        .col-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            max-width: 15%;
            position: relative;
            min-width: 0; /* Permite flexión flexible */
        }
        .view-lideres .col-item { max-width: 25%; } /* Menos columnas, más anchas */

        /* PUNTUACIÓN FLOTANTE */
        .col-score {
            font-size: 2.2vh;
            font-weight: 900;
            color: #000;
            margin-bottom: 0.8vh;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.8);
            transform: translateY(-2px);
            z-index: 5;
        }

        /* CONTENEDOR 3D DE LA COLUMNA */
        .col-bar-3d-wrapper {
            width: 100%;
            height: 15vh; /* Altura máxima del gráfico */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            background: #f8fafc; /* Rastro suave de fondo */
            border-radius: 6px;
            border: 1px dashed rgba(0,0,0,0.04);
            margin-bottom: 1.5vh;
        }

        /* LA COLUMNA 3D FÍSICA */
        .col-bar-3d {
            width: 100%;
            height: 0%; /* Crecimiento animado por JS */
            position: relative;
            transition: height 1.5s cubic-bezier(0.1, 0.7, 0.1, 1);
            transform-style: preserve-3d;
            border-radius: 4px;
        }

        /* Gradientes y Reflejos 3D para cada Puesto */
        .col-bar-3d.rank-1 {
            background: linear-gradient(to right, #b45309 0%, #fcd34d 25%, #fffbeb 50%, #f59e0b 80%, #92400e 100%);
            box-shadow: 2px 5px 12px rgba(180, 83, 9, 0.35);
        }
        .col-bar-3d.rank-2 {
            background: linear-gradient(to right, #475569 0%, #cbd5e1 25%, #ffffff 50%, #94a3b8 80%, #334155 100%);
            box-shadow: 2px 5px 12px rgba(71, 85, 105, 0.25);
        }
        .col-bar-3d.rank-3 {
            background: linear-gradient(to right, #9a3412 0%, #f97316 25%, #ffedd5 50%, #ea580c 80%, #7c2d12 100%);
            box-shadow: 2px 5px 12px rgba(154, 52, 18, 0.3);
        }
        .col-bar-3d.rank-4 {
            background: linear-gradient(to right, #0369a1 0%, #38bdf8 25%, #e0f2fe 50%, #0284c7 80%, #0c4a6e 100%);
            box-shadow: 2px 5px 10px rgba(3, 105, 161, 0.2);
        }
        .col-bar-3d.rank-5 {
            background: linear-gradient(to right, #4338ca 0%, #818cf8 25%, #e0e7ff 50%, #4f46e5 80%, #312e81 100%);
            box-shadow: 2px 5px 10px rgba(67, 56, 202, 0.2);
        }

        /* Equipos / Líderes en 3D */
        .col-bar-3d.team-A {
            background: linear-gradient(to right, #0369a1 0%, #38bdf8 25%, #f0f9ff 50%, #0284c7 80%, #082f49 100%);
            box-shadow: 3px 5px 15px rgba(2, 132, 199, 0.35);
        }
        .col-bar-3d.team-B {
            background: linear-gradient(to right, #9a3412 0%, #fb923c 25%, #fff7ed 50%, #ea580c 80%, #431407 100%);
            box-shadow: 3px 5px 15px rgba(234, 88, 12, 0.35);
        }
        .col-bar-3d.team-C {
            background: linear-gradient(to right, #065f46 0%, #34d399 25%, #ecfdf5 50%, #059669 80%, #064e3b 100%);
            box-shadow: 3px 5px 15px rgba(5, 150, 105, 0.35);
        }

        /* Tapa 3D Redonda (Efecto Cilindro) */
        .col-bar-cap {
            position: absolute;
            top: -4px;
            left: 0;
            width: 100%;
            height: 8px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.4);
            z-index: 2;
        }
        .rank-1 .col-bar-cap { background: radial-gradient(circle, #fffbeb 10%, #f59e0b 80%, #b45309 100%); }
        .rank-2 .col-bar-cap { background: radial-gradient(circle, #ffffff 10%, #94a3b8 80%, #475569 100%); }
        .rank-3 .col-bar-cap { background: radial-gradient(circle, #ffedd5 10%, #ea580c 80%, #9a3412 100%); }
        .rank-4 .col-bar-cap { background: radial-gradient(circle, #e0f2fe 10%, #0284c7 80%, #0369a1 100%); }
        .rank-5 .col-bar-cap { background: radial-gradient(circle, #e0e7ff 10%, #4f46e5 80%, #4338ca 100%); }
        
        .team-A .col-bar-cap { background: radial-gradient(circle, #f0f9ff 10%, #0284c7 80%, #0369a1 100%); }
        .team-B .col-bar-cap { background: radial-gradient(circle, #fff7ed 10%, #ea580c 80%, #9a3412 100%); }
        .team-C .col-bar-cap { background: radial-gradient(circle, #ecfdf5 10%, #059669 80%, #065f46 100%); }

        /* Sombra Base */
        .col-bar-shadow {
            position: absolute;
            bottom: -5px;
            left: 5%;
            width: 90%;
            height: 6px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 50%;
            filter: blur(1.5px);
            z-index: -1;
        }

        /* METADATOS Y ADORNOS DE BASE */
        .col-medal {
            font-size: 2.5vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5vh;
            line-height: 1;
        }

        .col-name {
            font-size: 1.4vh;
            font-weight: 800;
            color: #000;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
        }

        .col-sub {
            font-size: 1vh;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-badge {
            font-size: 1vh;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            color: #fff;
            margin-top: 0.4vh;
            text-transform: uppercase;
        }

        /* Loader & Empty States */
        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-light); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: var(--primary); font-size: 3.5vh; font-weight: bold;}
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; opacity: 0.6; text-align: center; margin: auto;}
        .empty-state span { font-size: 5vh; margin-bottom: 10px;}
        .empty-state p { font-size: 2vh; font-weight: bold; color: var(--text-muted); margin: 0;}

        /* =========================================================
           RESPONSIVE DESIGN (MÓVILES Y TABLETS VERTICALES)
           ========================================================= */
        @media (max-width: 1024px) {
            body {
                height: auto; /* Permite hacer scroll */
                overflow-y: auto; 
                padding: 15px;
            }
            
            .header {
                flex-direction: column;
                height: auto;
                gap: 15px;
                text-align: center;
                margin-bottom: 25px;
            }
            .logo { height: 40px; }
            .title { font-size: 24px; }
            .subtitle { font-size: 14px; }
            .clock { font-size: 16px; padding: 10px 20px; }

            .grid-container {
                display: flex;
                flex-direction: column; /* Apila cuadrantes */
                height: auto;
                gap: 25px;
            }

            .quadrant {
                width: 100%;
                min-height: 380px; /* Asegura un área estable para las columnas */
                padding: 20px 15px;
            }
            
            .q-title { font-size: 18px; }
            .q-subtitle { font-size: 11px; }

            .q-body {
                flex-direction: row; /* Fuerza a las columnas a estar una al lado de la otra */
                gap: 8px;
                align-items: flex-end;
                justify-content: space-evenly;
                height: auto;
                min-height: 250px;
                padding-top: 10px;
            }

            .col-item {
                max-width: 18%; /* Permite que utilicen el ancho completo del espacio */
                flex: 1;
                min-width: 0;
            }
            .view-lideres .col-item { max-width: 28%; }

            .col-score {
                font-size: 14px;
                margin-bottom: 5px;
            }

            .col-bar-3d-wrapper {
                height: 120px; /* Tamaño físico seguro para móvil */
                margin-bottom: 10px;
                width: 100%;
            }

            .col-medal {
                font-size: 18px;
                width: 24px;
                height: 24px;
                margin-bottom: 4px;
            }

            .col-name {
                font-size: 10px;
                white-space: normal; /* Permite saltar de línea */
                display: -webkit-box;
                -webkit-line-clamp: 2; /* Máximo dos líneas */
                -webkit-box-orient: vertical;
                overflow: hidden;
                line-height: 1.2;
                height: 24px; /* Espacio exacto para dos líneas sin pisar el resto */
                text-overflow: ellipsis;
            }

            .col-sub {
                font-size: 8px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                margin-top: 2px;
            }

            .col-badge {
                font-size: 8px;
                padding: 1px 3px;
                margin-top: 2px;
            }
        }

    </style>
</head>
<body>

    <div id="loader">
        <span>Sincronizando Dashboard y Generando Gráficos 3D... ⏳</span>
    </div>

    <div class="header">
        <img src="libus_positivo_CMYK.jpg" alt="Libus" class="logo" onerror="this.src='https://latam.libus.com/imagenes/logo_libus.png'">
        <div class="title-box">
            <h1 class="title" id="dynamicMainTitle">DESEMPEÑO OPERATIVO</h1>
            <div class="subtitle" id="fechaHoy">Calculando...</div>
        </div>
        <div class="clock" id="liveClock">00:00:00</div>
    </div>

    <div class="grid-container" id="mainGrid">
        <!-- Los 4 cuadrantes con gráficos verticales 3D se inyectan aquí -->
    </div>

    <script>
        // ---------------------------------------------------------
        // RUTEO DE PANTALLA (Lee el link: ?pantalla=operadores)
        // ---------------------------------------------------------
        const urlParams = new URLSearchParams(window.location.search);
        let currentView = urlParams.get('pantalla');
        if (!currentView) currentView = 'operadores'; // Default
        currentView = currentView.toLowerCase();

        // Aplicar clase al body para CSS específico
        document.body.classList.add('view-' + currentView);

        // ---------------------------------------------------------
        // CONFIGURACIÓN E INTELIGENCIA DE DATOS
        // ---------------------------------------------------------
        const ROSTER_API = 'https://script.google.com/macros/s/AKfycbzxBhGp2oElpCW6YzacSbDhqGvbih0X0dBZmnipIkscPp2uJx2CqRQstESXu7M0iZ1gLA/exec';
        const EFF_API = 'https://script.google.com/macros/s/AKfycbzCdptPfonJ8qAg9Bv2GbmpiE7xqNxtcYAZDjfmtgrh6wwj2XWkygecktqV7uxKm0QZ/exec';

        const PERSONNEL = [
            { keys: ["dilan"], name: "Dilan Bandes", team: "EQUIPO DILAN (TURNO A)", tColor: "var(--team-a)", tClass: "team-A" },
            { keys: ["martha"], name: "Martha Zúñiga", team: "EQUIPO DILAN (TURNO A)", tColor: "var(--team-a)", tClass: "team-A" },
            { keys: ["corrotea", "gustabo c", "gustavo c"], name: "Gustavo Corrotea", team: "EQUIPO DILAN (TURNO A)", tColor: "var(--team-a)", tClass: "team-A" },
            { keys: ["joel"], name: "Joel Santana", team: "EQUIPO DILAN (TURNO A)", tColor: "var(--team-a)", tClass: "team-A" },
            { keys: ["magaly"], name: "Magaly Fuentes", team: "EQUIPO DILAN (TURNO A)", tColor: "var(--team-a)", tClass: "team-A" },
            
            { keys: ["miguel"], name: "Miguel Reyes", team: "EQUIPO MIGUEL (TURNO B)", tColor: "var(--team-b)", tClass: "team-B" },
            { keys: ["adolfo", "gustavo a", "gustabo a"], name: "Gustavo Adolfo R.", team: "EQUIPO MIGUEL (TURNO B)", tColor: "var(--team-b)", tClass: "team-B" },
            { keys: ["efrain"], name: "Efraín Zuleta", team: "EQUIPO MIGUEL (TURNO B)", tColor: "var(--team-b)", tClass: "team-B" },
            { keys: ["yamile"], name: "Yamile Bermúdez", team: "EQUIPO MIGUEL (TURNO B)", tColor: "var(--team-b)", tClass: "team-B" },
            { keys: ["marisol"], name: "Marisol Carrillo", team: "EQUIPO MIGUEL (TURNO B)", tColor: "var(--team-b)", tClass: "team-B" },
            
            { keys: ["nilson"], name: "Nilson Chiquito", team: "EQUIPO NILSON (TURNO C)", tColor: "var(--team-c)", tClass: "team-C" },
            { keys: ["genesis", "jenesis"], name: "Génesis León", team: "EQUIPO NILSON (TURNO C)", tColor: "var(--team-c)", tClass: "team-C" },
            { keys: ["julio"], name: "Julio Alegría", team: "EQUIPO NILSON (TURNO C)", tColor: "var(--team-c)", tClass: "team-C" },
            { keys: ["edgar"], name: "Edgar Balcazar", team: "EQUIPO NILSON (TURNO C)", tColor: "var(--team-c)", tClass: "team-C" },
            { keys: ["freddy", "fredi"], name: "Freddy Gómez", team: "EQUIPO NILSON (TURNO C)", tColor: "var(--team-c)", tClass: "team-C" }
        ];

        function identifyPerson(text) {
            if(!text) return null;
            let t = String(text).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            for(let p of PERSONNEL) {
                for(let k of p.keys) { if(t.includes(k)) return p; }
            }
            return null;
        }

        let rkInterval, mqInterval;
        let globalDataCache = null; 

        setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('es-CL'); }, 1000);

        function fetchJSONP(url, prefix) {
            return new Promise((resolve, reject) => {
                const callbackName = prefix + '_' + Math.round(100000 * Math.random());
                window[callbackName] = function(data) {
                    resolve(data);
                    delete window[callbackName];
                    const scriptEl = document.getElementById(callbackName);
                    if(scriptEl) scriptEl.remove();
                };
                const script = document.createElement('script');
                script.id = callbackName;
                script.src = `${url}?callback=${callbackName}&_t=${Date.now()}`;
                script.onerror = () => reject(`Error conectando a Google Sheets`);
                document.body.appendChild(script);
            });
        }

        function parseRobustFloat(val) {
            if (!val) return 0;
            let str = String(val).replace(/%/g, '').trim(); 
            if (str.includes(',') && !str.includes('.')) str = str.replace(',', '.');
            else if (str.includes('.') && str.includes(',')) str = str.replace(/\./g, '').replace(',', '.');
            return parseFloat(str) || 0;
        }

        function normalizeDateToNum(dateInput) {
            if (!dateInput) return null;
            let str = String(dateInput).trim();
            if (str === "") return null;
            if (str.includes('T')) str = str.split('T')[0];
            if (str.includes('-')) {
                let p = str.split('-');
                if (p.length >= 3) {
                    if (p[0].length === 4) return parseInt(p[0] + p[1].padStart(2,'0') + p[2].substring(0,2).padStart(2,'0'), 10);
                    if (p[2].length === 4) return parseInt(p[2] + p[1].padStart(2,'0') + p[0].substring(0,2).padStart(2,'0'), 10);
                }
            }
            if (str.includes('/')) {
                let p = str.split(' ')[0].split('/');
                if (p.length >= 2) {
                    let d = p[0].padStart(2,'0'), m = p[1].padStart(2,'0'), y = p.length === 3 ? p[2] : String(new Date().getFullYear());
                    if (y.length === 2) y = "20" + y;
                    return parseInt(y + m + d, 10);
                }
            }
            return null;
        }

        function formatNumToDateStr(num) {
            let str = String(num);
            if(str.length !== 8) return "";
            return `${str.substring(6,8)}/${str.substring(4,6)}/${str.substring(0,4)}`;
        }

        function startEngine() {
            Promise.all([fetchJSONP(ROSTER_API, 'roster'), fetchJSONP(EFF_API, 'eff')])
            .then(([rosterData, effData]) => {
                processData(rosterData, effData);
            }).catch(err => {
                document.getElementById('loader').innerHTML = "❌ Error de conexión con Planillas. Recargue.";
            });
        }

        function processData(rosterData, effData) {
            let hoyDate = new Date();
            let hoyNum = parseInt(`${hoyDate.getFullYear()}${String(hoyDate.getMonth()+1).padStart(2,'0')}${String(hoyDate.getDate()).padStart(2,'0')}`);
            let hace7Num = hoyNum - 7; 
            let currentYM = Math.floor(hoyNum / 100); 

            // 1. CARGAR ASIGNACIONES
            let rosterMap = {}; 
            let dateCols = {};

            if (rosterData && rosterData.length > 0) {
                let isObject = !Array.isArray(rosterData[0]);
                if (isObject) {
                    Object.keys(rosterData[0]).forEach(k => { let d = normalizeDateToNum(k); if(d) dateCols[k] = d; });
                } else {
                    let bestRow = -1, maxDates = 0;
                    for(let r=0; r < Math.min(10, rosterData.length); r++) {
                        let count = 0;
                        rosterData[r].forEach(c => { if(normalizeDateToNum(c)) count++; });
                        if(count > maxDates) { maxDates = count; bestRow = r; }
                    }
                    if(bestRow > -1) {
                        rosterData[bestRow].forEach((c, idx) => { let d = normalizeDateToNum(c); if(d) dateCols[idx] = d; });
                    }
                }

                for (let i = isObject ? 0 : 1; i < rosterData.length; i++) {
                    let row = rosterData[i];
                    let vals = isObject ? Object.values(row) : row;
                    let opObj = null;
                    for (let v of vals) {
                        let matched = identifyPerson(v);
                        if (matched) { opObj = matched; break; }
                    }
                    if (!opObj) continue; 
                    
                    for (let key in dateCols) {
                        let dateNum = dateCols[key];
                        let asignacion = String(row[key] || "").trim().toUpperCase();
                        if (asignacion.includes("(") && (asignacion.includes("M)") || asignacion.includes("T)") || asignacion.includes("N)"))) {
                            let parts = asignacion.split("(");
                            let maqStr = parts[0].replace(/M/g, '').replace(/MAQ/g,'').trim();
                            let turnoLetra = parts[1].replace(')','').trim(); 
                            if (!rosterMap[dateNum]) rosterMap[dateNum] = {};
                            maqStr.split('-').forEach(num => {
                                let n = parseInt(num, 10);
                                if (!isNaN(n)) {
                                    if (!rosterMap[dateNum][n]) rosterMap[dateNum][n] = {};
                                    rosterMap[dateNum][n][turnoLetra] = opObj;
                                }
                            });
                        }
                    }
                }
            }

            // 2. DOS PASADAS PARA ENCONTRAR EL "DÍA ANTERIOR" REAL
            let allValidDates = new Set();
            let rawEffData = [];

            if (effData && effData.length > 0) {
                let isEffObj = !Array.isArray(effData[0]);
                let eHeaders = [];
                let effStartIndex = 0;
                
                if (isEffObj) { eHeaders = Object.keys(effData[0]); } 
                else {
                    for(let r=0; r < Math.min(5, effData.length); r++) {
                        let rowStr = effData[r].join(" ").toLowerCase();
                        if(rowStr.includes("maquina") || rowStr.includes("turno")) {
                            eHeaders = effData[r]; effStartIndex = r + 1; break;
                        }
                    }
                }

                for (let i = effStartIndex; i < effData.length; i++) {
                    let row = effData[i];
                    let rClean = {};
                    if (isEffObj) {
                        for (let k in row) rClean[String(k).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s/g, "")] = row[k];
                    } else {
                        for (let j = 0; j < eHeaders.length; j++) rClean[String(eHeaders[j]).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s/g, "")] = row[j];
                    }

                    const getCol = (keywords) => {
                        for (let k in rClean) { for(let w of keywords) { if (k.includes(w)) return rClean[k]; } }
                        return null;
                    };

                    let rendRaw = parseRobustFloat(getCol(["disponibilidad", "rendimiento", "eficiencia"]) || (isEffObj ? 0 : row[3]));
                    let calRaw = parseRobustFloat(getCol(["calidad"]) || (isEffObj ? 0 : row[4]));
                    let tno = String(getCol(["turno"]) || (isEffObj ? '' : row[1]) || "").trim().toUpperCase();
                    let maqStr = String(getCol(["maquina", "inyectora"]) || (isEffObj ? '' : row[2]) || "").trim();
                    let fechaRaw = getCol(["fecha", "dia", "date"]) || (isEffObj ? '' : row[0]);

                    let recDateNum = normalizeDateToNum(fechaRaw);
                    if (!recDateNum) continue;

                    if (maqStr && tno && (rendRaw > 0 || calRaw > 0)) {
                        let maqNum = parseInt(maqStr.replace(/\D/g, ''), 10);
                        if (isNaN(maqNum)) continue;
                        let letraTurno = tno.includes("MAÑ") ? "M" : (tno.includes("TAR") ? "T" : "N");

                        let rend = (rendRaw <= 1.5 && rendRaw !== 0) ? rendRaw * 100 : rendRaw;
                        let cal = (calRaw <= 1.5 && calRaw !== 0) ? calRaw * 100 : calRaw;
                        let eff = (rend / 100) * (cal / 100) * 100;
                        if (eff > 100) eff = 100.0;

                        allValidDates.add(recDateNum);

                        rawEffData.push({
                            dateNum: recDateNum,
                            maqNum: maqNum,
                            letraTurno: letraTurno,
                            eff: eff,
                            rawCols: rClean
                        });
                    }
                }
            }

            let sortedDates = Array.from(allValidDates).sort((a,b) => b - a);
            let latestDateNum = sortedDates.length > 0 ? sortedDates[0] : hoyNum;
            
            let pastDates = sortedDates.filter(d => d < hoyNum);
            let diaAnteriorNum = pastDates.length > 0 ? pastDates[0] : null;
            let diaAnteriorStr = diaAnteriorNum ? formatNumToDateStr(diaAnteriorNum) : "SIN DATOS";

            if(currentView === 'operadores') document.getElementById('dynamicMainTitle').innerText = 'TOP OPERADORES - PLANTA';
            else if(currentView === 'lideres') document.getElementById('dynamicMainTitle').innerText = 'RENDIMIENTO LÍDERES DE TURNO';
            else if(currentView === 'maquinas') document.getElementById('dynamicMainTitle').innerText = 'RANKING POR MÁQUINA';

            document.getElementById('fechaHoy').innerText = `SISTEMA ACTIVO: ${formatNumToDateStr(latestDateNum)}`;

            let opStats = { ayer: {}, semana: {}, mes: {}, global: {} };
            let teamStats = { ayer: {}, semana: {}, mes: {}, global: {} };
            let maqStats = { ayer: {}, semana: {}, mes: {}, global: {} };

            const addObjStat = (dict, key, eff, obj) => {
                if(!dict[key]) dict[key] = {sum:0, count:0, obj:obj};
                dict[key].sum += eff; dict[key].count++;
            };

            const addMaqStat = (timeframe, maq, opName, eff, obj) => {
                if(!maqStats[timeframe][maq]) maqStats[timeframe][maq] = {};
                if(!maqStats[timeframe][maq][opName]) maqStats[timeframe][maq][opName] = {sum:0, count:0, obj:obj};
                maqStats[timeframe][maq][opName].sum += eff;
                maqStats[timeframe][maq][opName].count++;
            };

            rawEffData.forEach(item => {
                let opObj = null;
                for(let key in item.rawCols) {
                    let match = identifyPerson(item.rawCols[key]);
                    if (match) { opObj = match; break; }
                }
                if (!opObj && rosterMap[item.dateNum] && rosterMap[item.dateNum][item.maqNum] && rosterMap[item.dateNum][item.maqNum][item.letraTurno]) {
                    opObj = rosterMap[item.dateNum][item.maqNum][item.letraTurno];
                }

                if(opObj) {
                    let recYM = Math.floor(item.dateNum / 100);
                    
                    addObjStat(opStats.global, opObj.name, item.eff, opObj);
                    addObjStat(teamStats.global, opObj.team, item.eff, opObj);
                    addMaqStat('global', item.maqNum, opObj.name, item.eff, opObj);

                    if (recYM === currentYM) {
                        addObjStat(opStats.mes, opObj.name, item.eff, opObj);
                        addObjStat(teamStats.mes, opObj.team, item.eff, opObj);
                        addMaqStat('mes', item.maqNum, opObj.name, item.eff, opObj);
                    }

                    if (item.dateNum >= hace7Num) {
                        addObjStat(opStats.semana, opObj.name, item.eff, opObj);
                        addObjStat(teamStats.semana, opObj.team, item.eff, opObj);
                        addMaqStat('semana', item.maqNum, opObj.name, item.eff, opObj);
                    }

                    if (item.dateNum === diaAnteriorNum) {
                        addObjStat(opStats.ayer, opObj.name, item.eff, opObj);
                        addObjStat(teamStats.ayer, opObj.team, item.eff, opObj);
                        addMaqStat('ayer', item.maqNum, opObj.name, item.eff, opObj);
                    }
                }
            });

            globalDataCache = {
                diaAnteriorStr: diaAnteriorStr,
                opStats: opStats,
                teamStats: teamStats,
                maqStats: maqStats,
                machineKeys: Object.keys(maqStats.global).map(Number).sort((a,b)=>a-b)
            };

            renderCurrentView();
            document.getElementById('loader').style.display = 'none';
        }

        const getTopList = (dict, limit) => {
            let arr = [];
            for(let key in dict) arr.push({ name: key, eff: dict[key].sum / dict[key].count, obj: dict[key].obj });
            return arr.sort((a,b) => b.eff - a.eff).slice(0, limit);
        };

        // =========================================================
        // RESTRICCIÓN RENDER: 3D VERTICAL COLUMNS
        // =========================================================
        function renderQuadrant(title, subtitle, list, isTeamMode) {
            let html = `
            <div class="quadrant">
                <div class="q-header">
                    <h2 class="q-title">${title}</h2>
                    <div class="q-subtitle">${subtitle}</div>
                </div>
                <div class="q-body">`;
            
            if (list.length === 0) {
                html += `<div class="empty-state"><span>📊</span><p>SIN DATOS REGISTRADOS</p></div>`;
            } else {
                let medals = ['🥇', '🥈', '🥉', '4°', '5°'];
                list.forEach((item, index) => {
                    let scoreText = item.eff.toFixed(1).replace('.',',') + '%';
                    
                    let isMedal = index < 3;
                    let displayLabelOrMedal = isMedal ? `<span class="col-medal">${medals[index]}</span>` : `<div class="col-medal" style="font-size:1.1vh; font-weight:800; color:var(--text-muted); padding:3px 0;">${index+1}°</div>`;
                    
                    let col3DClass = isTeamMode ? item.obj.tClass : `rank-${index+1}`;
                    let colorNombre = (index === 0 && !isTeamMode) ? 'var(--gold-dark)' : (isTeamMode ? item.obj.tColor : '#1e293b');
                    
                    let badgeLabel = isTeamMode ? item.name.split(" ")[1] || "TEAM" : '';
                    let badgeColor = isTeamMode ? item.obj.tColor : '';
                    
                    let subInfo = isTeamMode ? 'LÍDER' : (item.obj ? item.obj.team.split(" (")[0] : '');
                    
                    html += `
                    <div class="col-item">
                        <div class="col-score" style="color:${colorNombre};">${scoreText}</div>
                        <div class="col-bar-3d-wrapper">
                            <div class="col-bar-3d ${col3DClass}" data-height="${item.eff > 100 ? 100 : item.eff}">
                                <div class="col-bar-cap"></div>
                                <div class="col-bar-shadow"></div>
                            </div>
                        </div>
                        ${displayLabelOrMedal}
                        <div class="col-name" title="${item.name}">${item.name}</div>
                        <div class="col-sub">${subInfo}</div>
                        ${isTeamMode ? `<span class="col-badge" style="background-color:${badgeColor};">${badgeLabel}</span>` : ''}
                    </div>`;
                });
            }
            html += `</div></div>`;
            return html;
        }

        function renderCurrentView() {
            let grid = document.getElementById('mainGrid');
            let cache = globalDataCache;
            let html = '';

            if (currentView === 'operadores') {
                html += renderQuadrant("DÍA ANTERIOR", cache.diaAnteriorStr, getTopList(cache.opStats.ayer, 5), false);
                html += renderQuadrant("ÚLTIMOS 7 DÍAS", "EVALUACIÓN SEMANAL", getTopList(cache.opStats.semana, 5), false);
                html += renderQuadrant("MES ACTUAL", "EVALUACIÓN MENSUAL", getTopList(cache.opStats.mes, 5), false);
                html += renderQuadrant("HISTÓRICO GLOBAL", "EVALUACIÓN GENERAL", getTopList(cache.opStats.global, 5), false);
                grid.innerHTML = html;
            } 
            else if (currentView === 'lideres') {
                html += renderQuadrant("LÍDERES: DÍA ANTERIOR", cache.diaAnteriorStr, getTopList(cache.teamStats.ayer, 3), true);
                html += renderQuadrant("LÍDERES: ÚLTIMOS 7 DÍAS", "EVALUACIÓN SEMANAL", getTopList(cache.teamStats.semana, 3), true);
                html += renderQuadrant("LÍDERES: MES ACTUAL", "EVALUACIÓN MENSUAL", getTopList(cache.teamStats.mes, 3), true);
                html += renderQuadrant("LÍDERES: GLOBAL", "EVALUACIÓN GENERAL", getTopList(cache.teamStats.global, 3), true);
                grid.innerHTML = html;
            }
            else if (currentView === 'maquinas') {
                if (cache.machineKeys.length === 0) {
                    grid.innerHTML = `<div class="empty-state" style="grid-column: span 2;"><span>⏳</span><p>SIN MÁQUINAS REGISTRADAS</p></div>`;
                    return;
                }
                
                let currentMaqIndex = 0;
                
                const updateMachineGrid = () => {
                    let m = cache.machineKeys[currentMaqIndex];
                    document.getElementById('dynamicMainTitle').innerText = `MÁQUINA ${m} - RANKING OPERADORES`;
                    
                    let mqHtml = '';
                    mqHtml += renderQuadrant("MÁQUINA " + m + " - DÍA ANTERIOR", cache.diaAnteriorStr, getTopList(cache.maqStats.ayer[m] || {}, 5), false);
                    mqHtml += renderQuadrant("MÁQUINA " + m + " - 7 DÍAS", "EVALUACIÓN SEMANAL", getTopList(cache.maqStats.semana[m] || {}, 5), false);
                    mqHtml += renderQuadrant("MÁQUINA " + m + " - MES", "EVALUACIÓN MENSUAL", getTopList(cache.maqStats.mes[m] || {}, 5), false);
                    mqHtml += renderQuadrant("MÁQUINA " + m + " - GLOBAL", "EVALUACIÓN GENERAL", getTopList(cache.maqStats.global[m] || {}, 5), false);
                    grid.innerHTML = mqHtml;

                    // Forzar animación de las barras 3D
                    setTimeout(() => {
                        grid.querySelectorAll('.col-bar-3d').forEach(b => {
                            let targetVal = b.getAttribute('data-height');
                            b.style.height = targetVal + '%';
                        });
                    }, 80);

                    currentMaqIndex = (currentMaqIndex + 1) % cache.machineKeys.length;
                };

                updateMachineGrid();
                clearInterval(maqInterval);
                maqInterval = setInterval(updateMachineGrid, 8000); 
            }
            
            // Forzar animación inicial (Para no-rotativas)
            if(currentView !== 'maquinas') {
                setTimeout(() => {
                    grid.querySelectorAll('.col-bar-3d').forEach(b => {
                        let targetVal = b.getAttribute('data-height');
                        b.style.height = targetVal + '%';
                    });
                }, 80);
            }
        }

        window.onload = startEngine;
        setInterval(startEngine, 300000); 
    </script>
</body>
