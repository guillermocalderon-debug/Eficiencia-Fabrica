<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking y Asignación - Libus</title>
    <style>
        :root {
            --primary: #e6005a;
            --bg: #0f172a; /* Fondo oscuro elegante para TV */
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            
            --sober-m: #38bdf8; /* Celeste Mañana */
            --sober-t: #fb923c; /* Naranja Tarde */
            --sober-n: #818cf8; /* Indigo Noche */
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text-light); margin: 0; padding: 2vh 2vw; display: flex; flex-direction: column; height: 100vh; overflow: hidden; box-sizing: border-box;}
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 1.5vh; margin-bottom: 2vh;}
        .logo { height: min(40px, 5vh); filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
        .title-box { text-align: center; flex-grow: 1;}
        .title { margin: 0; font-size: min(35px, 4vh); font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase;}
        .subtitle { color: var(--primary); font-weight: bold; font-size: min(18px, 2vh); margin-top: 5px; text-transform: uppercase;}
        .clock { font-size: min(20px, 2.5vh); font-weight: bold; color: var(--primary); background: #334155; padding: 0.5vh 1.5vw; border-radius: 20px;}

        /* Contenedor Elástico de Máquinas */
        .machines-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5vw; flex-grow: 1;}
        
        .machine-card { background: var(--card-bg); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 5px solid var(--primary); display: flex; flex-direction: column; overflow: hidden; position: relative;}
        .machine-name { text-align: center; font-size: 2.5vh; font-weight: 900; background: #0f172a; padding: 1vh; margin: 0; border-bottom: 1px solid #334155;}
        
        /* Lista de operadores por turno */
        .ops-list { display: flex; flex-direction: column; flex-grow: 1; padding: 1vh 1vw; gap: 1vh; justify-content: center;}
        
        .op-row { display: flex; align-items: center; background: #334155; border-radius: 10px; padding: 1vh; border-left: 5px solid #64748b;}
        .op-row.m { border-left-color: var(--sober-m); }
        .op-row.t { border-left-color: var(--sober-t); }
        .op-row.n { border-left-color: var(--sober-n); }
        
        .op-avatar { width: 4vh; height: 4vh; background: #475569; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.8vh; margin-right: 1vw; color: #fff;}
        .op-details { flex-grow: 1;}
        .op-name { font-size: 1.8vh; font-weight: bold; margin: 0; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 15vw;}
        .op-shift { font-size: 1.3vh; font-weight: 900; color: var(--text-muted); text-transform: uppercase;}
        
        /* Simulación de Rango/Medalla (Para cruzar con eficiencia después) */
        .op-rank { font-size: 2vh; }

        #loader { text-align: center; color: var(--primary); font-weight: bold; font-size: 2vh; margin-top: 20vh;}

        @media (max-width: 768px) {
            body { height: auto; overflow-y: visible; padding: 15px;}
            .header { flex-direction: column; gap: 15px;}
            .machines-grid { grid-template-columns: 1fr; }
            .op-name { max-width: 50vw;}
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="libus_positivo_CMYK.jpg" alt="Libus" class="logo" onerror="this.src='https://latam.libus.com/imagenes/logo_libus.png'">
        <div class="title-box">
            <h1 class="title">📋 ASIGNACIÓN DE PLANTA</h1>
            <div class="subtitle" id="fechaHoy">Buscando fecha...</div>
        </div>
        <div class="clock" id="liveClock">00:00:00</div>
    </div>

    <div id="loader">Conectando con matriz de turnos... ⏳</div>
    
    <div class="machines-grid" id="machinesGrid">
        <!-- Las máquinas se generan dinámicamente -->
    </div>

    <script>
        // API de tu matriz de turnos
        const ROSTER_API = 'https://script.google.com/macros/s/AKfycbzxBhGp2oElpCW6YzacSbDhqGvbih0X0dBZmnipIkscPp2uJx2CqRQstESXu7M0iZ1gLA/exec';

        // Reloj
        setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('es-CL'); }, 1000);

        // Nombres de las máquinas a mostrar
        const MACHINE_IDS = [1, 2, 3, 4, 5, 6, 7];

        function getAvatarInitials(name) {
            if(!name) return "?";
            let parts = name.trim().split(" ");
            if(parts.length >= 2) return parts[0][0] + parts[1][0];
            return parts[0][0];
        }

        function renderRoster(data) {
            document.getElementById('loader').style.display = 'none';
            if(!data || data.length < 2) return;

            // 1. Obtener la fecha de hoy en formato DD/MM/YYYY para buscar la columna
            let hoyDate = new Date();
            let dia = String(hoyDate.getDate()).padStart(2, '0');
            let mes = String(hoyDate.getMonth() + 1).padStart(2, '0');
            let anio = hoyDate.getFullYear();
            let fechaStrBusqueda = `${dia}/${mes}/${anio}`; 
            
            document.getElementById('fechaHoy').innerText = `TURNO DEL DÍA: ${fechaStrBusqueda}`;

            let headers = data[0];
            let colIndex = headers.indexOf(fechaStrBusqueda);
            
            // Si por algún motivo no encuentra el día exacto (ej. error de tipografía en el Excel), forzamos una columna de prueba para que no se vea vacío
            if(colIndex === -1) {
                // Buscamos alguna columna que parezca fecha
                for(let i=2; i<headers.length; i++) {
                    if(headers[i].includes('/')) { colIndex = i; break; }
                }
                document.getElementById('fechaHoy').innerText = `Mostrando datos de: ${headers[colIndex]} (Hoy no encontrado)`;
            }

            // 2. Estructura para agrupar operarios por Máquina y por Turno
            let maqData = {};
            MACHINE_IDS.forEach(m => maqData[m] = { M: null, T: null, N: null });

            // 3. Procesar las filas de los operarios
            for(let i = 1; i < data.length; i++) {
                let row = data[i];
                let operario = row[1];
                let asignacion = row[colIndex]; // Ej: "M1-3-4 (T)", "M2-6 (N)", "Libre"

                if(asignacion && asignacion !== "Libre" && asignacion !== "-" && asignacion.includes("(")) {
                    // Separar máquinas del turno. Ej: "M1-3-4" y "(T)"
                    let parts = asignacion.split("(");
                    let maqStr = parts[0].replace('M', '').trim(); // "1-3-4"
                    let turnoLetra = parts[1].replace(')', '').trim(); // "T"

                    // Extraer los números de las máquinas
                    let numeros = maqStr.split('-');
                    numeros.forEach(num => {
                        let n = parseInt(num);
                        if(maqData[n]) {
                            maqData[n][turnoLetra] = operario;
                        }
                    });
                }
            }

            // 4. Dibujar las tarjetas de las máquinas
            let gridHtml = '';
            
            MACHINE_IDS.forEach(m => {
                let ops = maqData[m];
                
                // Función interna para dibujar la fila de un operador
                const getOpRow = (nombre, tipo, colorClase, turnoLabel) => {
                    if(!nombre) return `<div class="op-row" style="opacity: 0.3;"><div class="op-avatar">-</div><div class="op-details"><p class="op-name">Sin asignar</p><p class="op-shift">${turnoLabel}</p></div></div>`;
                    
                    let iniciales = getAvatarInitials(nombre);
                    return `
                    <div class="op-row ${colorClase}">
                        <div class="op-avatar" style="background-color: var(--sober-${colorClase});">${iniciales}</div>
                        <div class="op-details">
                            <p class="op-name">${nombre}</p>
                            <p class="op-shift">${turnoLabel}</p>
                        </div>
                        <div class="op-rank">💪</div>
                    </div>`;
                };

                gridHtml += `
                <div class="machine-card">
                    <h3 class="machine-name">MÁQUINA ${m}</h3>
                    <div class="ops-list">
                        ${getOpRow(ops['M'], 'M', 'm', '☀️ MAÑANA')}
                        ${getOpRow(ops['T'], 'T', 't', '🌤 TARDE')}
                        ${getOpRow(ops['N'], 'N', 'n', '🌙 NOCHE')}
                    </div>
                </div>`;
            });

            document.getElementById('machinesGrid').innerHTML = gridHtml;
        }

        function loadData() {
            const callbackName = 'jsonpCallback_' + Math.round(100000 * Math.random());
            window[callbackName] = function(data) {
                renderRoster(data);
                delete window[callbackName];
                document.getElementById(callbackName).remove();
            };
            const script = document.createElement('script');
            script.id = callbackName;
            script.src = `${ROSTER_API}?callback=${callbackName}&_t=${Date.now()}`;
            document.body.appendChild(script);
        }

        window.onload = () => {
            loadData();
            setInterval(loadData, 300000); // 5 mins
        };
    </script>
</body>
</html>
