<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Libus - Yodeck</title>
    <style>
        /* =========================================================
           VARIABLES CORPORATIVAS Y DE COLOR
           ========================================================= */
        :root {
            --primary: #e6005a;
            --bg-light: #f4f7f6;
            --card-bg: #ffffff;
            --text-dark: #222222;
            --text-muted: #666666;
            --border-color: #e2e8f0;
            
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #b45309;
            --alert: #ef4444;
            
            --team-a: #0ea5e9; /* Azul Dilan */
            --team-b: #f97316; /* Naranja Miguel */
            --team-c: #10b981; /* Verde Nilson */
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            padding: 2vh 2vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1.5vh;
            margin-bottom: 2vh;
            height: 8vh;
            flex-shrink: 0;
        }
        .logo { height: 100%; max-height: 50px; object-fit: contain; }
        .title-box { text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .title { margin: 0; font-size: 3.5vh; font-weight: 900; color: #111; letter-spacing: 1px; text-transform: uppercase; line-height: 1;}
        .subtitle { color: var(--primary); font-weight: bold; font-size: 1.8vh; margin-top: 4px; text-transform: uppercase;}
        .clock { font-size: 2.5vh; font-weight: bold; color: var(--text-muted); background: #e2e8f0; padding: 0.8vh 1.5vw; border-radius: 20px; letter-spacing: 2px;}

        /* =========================================================
           GRILLA 4 CUADRANTES (2x2)
           ========================================================= */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2vw;
            flex-grow: 1;
            height: calc(100vh - 12vh);
        }

        .quadrant {
            background: var(--card-bg);
            border-radius: 12px;
            border-top: 5px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 2vh 3vw;
        }
        
        .q-header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1vh;
            margin-bottom: 2vh;
        }
        .q-title { font-size: 2.5vh; font-weight: 900; color: #111; margin: 0; text-transform: uppercase; }
        .q-subtitle { font-size: 1.4vh; color: var(--text-muted); margin-top: 4px; font-weight: bold; text-transform: uppercase; }

        .q-body {
            flex-grow: 1;
            display: flex; 
            flex-direction: column; 
            justify-content: space-evenly;
        }

        /* Barras */
        .bar-row { display: flex; flex-direction: column; gap: 1vh; width: 100%; }
        .bar-info { display: flex; justify-content: space-between; align-items: flex-end; }
        .bar-rank-name { display: flex; align-items: center; gap: 1vw; font-size: 2.2vh; font-weight: 900; text-transform: uppercase; color: #222;}
        .bar-medal { font-size: 2.8vh; width: 4vh; text-align: center; }
        .bar-score { font-size: 2.5vh; font-weight: 900; color: #111;}
        
        .bar-track { width: 100%; height: 2vh; background: #f1f5f9; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0; }
        .bar-fill { height: 100%; width: 0%; border-radius: 10px; transition: width 1.5s cubic-bezier(0.1, 0.7, 0.1, 1); position: relative; overflow: hidden; }

        /* Pantalla Líderes: barras más gruesas (son solo 3) */
        .view-lideres .bar-track { height: 3.5vh; }
        .view-lideres .bar-rank-name { font-size: 3vh; }
        .view-lideres .bar-score { font-size: 3.5vh; }

        /* Pantalla Máquinas: Resalta el Título Principal */
        #dynamicMainTitle { color: var(--primary); font-size: 4vh; }

        /* Colores Base */
        .fill-1 { background: linear-gradient(90deg, #fef08a, #d97706); } 
        .fill-2 { background: linear-gradient(90deg, #f1f5f9, #64748b); } 
        .fill-3 { background: linear-gradient(90deg, #fde68a, #9a3412); } 
        .fill-4 { background: #38bdf8; }
        .fill-5 { background: #818cf8; }
        
        .fill-team-A { background: linear-gradient(90deg, #38bdf8, var(--team-a)); }
        .fill-team-B { background: linear-gradient(90deg, #fdba74, var(--team-b)); }
        .fill-team-C { background: linear-gradient(90deg, #6ee7b7, var(--team-c)); }

        .fill-1::after, .fill-team-A::after, .fill-team-B::after, .fill-team-C::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.6), transparent);
            transform: skewX(-20deg); animation: shimmer 2.5s infinite;
        }
        @keyframes shimmer { 0% { left: -100%; } 100% { left: 200%; } }

        /* Loader & Empty States */
        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-light); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: var(--primary); font-size: 3.5vh; font-weight: bold;}
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; opacity: 0.6; text-align: center; margin: auto;}
        .empty-state span { font-size: 5vh; margin-bottom: 10px;}
        .empty-state p { font-size: 2vh; font-weight: bold; color: var(--text-muted); margin: 0;}

    </style>
</head>
<body>

    <div id="loader">
        <span>Cargando Dashboard Multi-Pantalla... ⏳</span>
    </div>

    <div class="header">
        <img src="libus_positivo_CMYK.jpg" alt="Libus" class="logo" onerror="this.src='https://latam.libus.com/imagenes/logo_libus.png'">
        <div class="title-box">
            <h1 class="title" id="dynamicMainTitle">DESEMPEÑO OPERATIVO</h1>
            <div class="subtitle" id="fechaHoy">Calculando...</div>
        </div>
        <div class="clock" id="liveClock">00:00:00</div>
    </div>

    <div class="grid-container" id="mainGrid">
        <!-- Los 4 cuadrantes se inyectan aquí -->
    </div>

    <script>
        // ---------------------------------------------------------
        // RUTEO DE PANTALLA (Lee el link: ?pantalla=operadores)
        // ---------------------------------------------------------
        const urlParams = new URLSearchParams(window.location.search);
        let currentView = urlParams.get('pantalla');
        if (!currentView) currentView = 'operadores'; // Default
        currentView = currentView.toLowerCase();

        // Aplicar clase al body para CSS específico
        document.body.classList.add('view-' + currentView);

        // ---------------------------------------------------------
        // CONFIGURACIÓN E INTELIGENCIA DE DATOS
        // ---------------------------------------------------------
        const ROSTER_API = 'https://script.google.com/macros/s/AKfycbzxBhGp2oElpCW6YzacSbDhqGvbih0X0dBZmnipIkscPp2uJx2CqRQstESXu7M0iZ1gLA/exec';
        const EFF_API = 'https://script.google.com/macros/s/AKfycbzCdptPfonJ8qAg9Bv2GbmpiE7xqNxtcYAZDjfmtgrh6wwj2XWkygecktqV7uxKm0QZ/exec';

        const PERSONNEL = [
            { keys: ["dilan"], name: "Dilan Bandes", team: "EQUIPO DILAN (TURNO A)", tColor: "var(--team-a)", tClass: "fill-team-A" },
            { keys: ["martha"], name: "Martha Zúñiga", team: "EQUIPO DILAN (TURNO A)", tColor: "var(--team-a)", tClass: "fill-team-A" },
            { keys: ["corrotea", "gustabo c", "gustavo c"], name: "Gustavo Corrotea", team: "EQUIPO DILAN (TURNO A)", tColor: "var(--team-a)", tClass: "fill-team-A" },
            { keys: ["joel"], name: "Joel Santana", team: "EQUIPO DILAN (TURNO A)", tColor: "var(--team-a)", tClass: "fill-team-A" },
            { keys: ["magaly"], name: "Magaly Fuentes", team: "EQUIPO DILAN (TURNO A)", tColor: "var(--team-a)", tClass: "fill-team-A" },
            
            { keys: ["miguel"], name: "Miguel Reyes", team: "EQUIPO MIGUEL (TURNO B)", tColor: "var(--team-b)", tClass: "fill-team-B" },
            { keys: ["adolfo", "gustavo a", "gustabo a"], name: "Gustavo Adolfo R.", team: "EQUIPO MIGUEL (TURNO B)", tColor: "var(--team-b)", tClass: "fill-team-B" },
            { keys: ["efrain"], name: "Efraín Zuleta", team: "EQUIPO MIGUEL (TURNO B)", tColor: "var(--team-b)", tClass: "fill-team-B" },
            { keys: ["yamile"], name: "Yamile Bermúdez", team: "EQUIPO MIGUEL (TURNO B)", tColor: "var(--team-b)", tClass: "fill-team-B" },
            { keys: ["marisol"], name: "Marisol Carrillo", team: "EQUIPO MIGUEL (TURNO B)", tColor: "var(--team-b)", tClass: "fill-team-B" },
            
            { keys: ["nilson"], name: "Nilson Chiquito", team: "EQUIPO NILSON (TURNO C)", tColor: "var(--team-c)", tClass: "fill-team-C" },
            { keys: ["genesis", "jenesis"], name: "Génesis León", team: "EQUIPO NILSON (TURNO C)", tColor: "var(--team-c)", tClass: "fill-team-C" },
            { keys: ["julio"], name: "Julio Alegría", team: "EQUIPO NILSON (TURNO C)", tColor: "var(--team-c)", tClass: "fill-team-C" },
            { keys: ["edgar"], name: "Edgar Balcazar", team: "EQUIPO NILSON (TURNO C)", tColor: "var(--team-c)", tClass: "fill-team-C" },
            { keys: ["freddy", "fredi"], name: "Freddy Gómez", team: "EQUIPO NILSON (TURNO C)", tColor: "var(--team-c)", tClass: "fill-team-C" }
        ];

        function identifyPerson(text) {
            if(!text) return null;
            let t = String(text).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            for(let p of PERSONNEL) {
                for(let k of p.keys) { if(t.includes(k)) return p; }
            }
            return null;
        }

        let maqInterval;
        let globalDataCache = null; // Para rotar máquinas sin recalcular

        setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('es-CL'); }, 1000);

        function fetchJSONP(url, prefix) {
            return new Promise((resolve, reject) => {
                const callbackName = prefix + '_' + Math.round(100000 * Math.random());
                window[callbackName] = function(data) {
                    resolve(data);
                    delete window[callbackName];
                    const scriptEl = document.getElementById(callbackName);
                    if(scriptEl) scriptEl.remove();
                };
                const script = document.createElement('script');
                script.id = callbackName;
                script.src = `${url}?callback=${callbackName}&_t=${Date.now()}`;
                script.onerror = () => reject(`Error conectando a Google Sheets`);
                document.body.appendChild(script);
            });
        }

        function parseRobustFloat(val) {
            if (!val) return 0;
            let str = String(val).replace(/%/g, '').trim(); 
            if (str.includes(',') && !str.includes('.')) str = str.replace(',', '.');
            else if (str.includes('.') && str.includes(',')) str = str.replace(/\./g, '').replace(',', '.');
            return parseFloat(str) || 0;
        }

        function normalizeDateToNum(dateInput) {
            if (!dateInput) return null;
            let str = String(dateInput).trim();
            if (str === "") return null;
            if (str.includes('T')) str = str.split('T')[0];
            if (str.includes('-')) {
                let p = str.split('-');
                if (p.length >= 3) {
                    if (p[0].length === 4) return parseInt(p[0] + p[1].padStart(2,'0') + p[2].substring(0,2).padStart(2,'0'), 10);
                    if (p[2].length === 4) return parseInt(p[2] + p[1].padStart(2,'0') + p[0].substring(0,2).padStart(2,'0'), 10);
                }
            }
            if (str.includes('/')) {
                let p = str.split(' ')[0].split('/');
                if (p.length >= 2) {
                    let d = p[0].padStart(2,'0'), m = p[1].padStart(2,'0'), y = p.length === 3 ? p[2] : String(new Date().getFullYear());
                    if (y.length === 2) y = "20" + y;
                    return parseInt(y + m + d, 10);
                }
            }
            return null;
        }

        function formatNumToDateStr(num) {
            let str = String(num);
            if(str.length !== 8) return "";
            return `${str.substring(6,8)}/${str.substring(4,6)}/${str.substring(0,4)}`;
        }

        function startEngine() {
            Promise.all([fetchJSONP(ROSTER_API, 'roster'), fetchJSONP(EFF_API, 'eff')])
            .then(([rosterData, effData]) => {
                processData(rosterData, effData);
            }).catch(err => {
                document.getElementById('loader').innerHTML = "❌ Error de conexión con Planillas. Recargue.";
            });
        }

        function processData(rosterData, effData) {
            let hoyDate = new Date();
            let hoyNum = parseInt(`${hoyDate.getFullYear()}${String(hoyDate.getMonth()+1).padStart(2,'0')}${String(hoyDate.getDate()).padStart(2,'0')}`);
            let hace7Num = hoyNum - 7; 
            let currentYM = Math.floor(hoyNum / 100); 

            // 1. CARGAR ASIGNACIONES
            let rosterMap = {}; 
            let dateCols = {};

            if (rosterData && rosterData.length > 0) {
                let isObject = !Array.isArray(rosterData[0]);
                if (isObject) {
                    Object.keys(rosterData[0]).forEach(k => { let d = normalizeDateToNum(k); if(d) dateCols[k] = d; });
                } else {
                    let bestRow = -1, maxDates = 0;
                    for(let r=0; r < Math.min(10, rosterData.length); r++) {
                        let count = 0;
                        rosterData[r].forEach(c => { if(normalizeDateToNum(c)) count++; });
                        if(count > maxDates) { maxDates = count; bestRow = r; }
                    }
                    if(bestRow > -1) {
                        rosterData[bestRow].forEach((c, idx) => { let d = normalizeDateToNum(c); if(d) dateCols[idx] = d; });
                    }
                }

                for (let i = isObject ? 0 : 1; i < rosterData.length; i++) {
                    let row = rosterData[i];
                    let vals = isObject ? Object.values(row) : row;
                    let opObj = null;
                    for (let v of vals) {
                        let matched = identifyPerson(v);
                        if (matched) { opObj = matched; break; }
                    }
                    if (!opObj) continue; 
                    
                    for (let key in dateCols) {
                        let dateNum = dateCols[key];
                        let asignacion = String(row[key] || "").trim().toUpperCase();
                        if (asignacion.includes("(") && (asignacion.includes("M)") || asignacion.includes("T)") || asignacion.includes("N)"))) {
                            let parts = asignacion.split("(");
                            let maqStr = parts[0].replace(/M/g, '').replace(/MAQ/g,'').trim();
                            let turnoLetra = parts[1].replace(')','').trim(); 
                            if (!rosterMap[dateNum]) rosterMap[dateNum] = {};
                            maqStr.split('-').forEach(num => {
                                let n = parseInt(num, 10);
                                if (!isNaN(n)) {
                                    if (!rosterMap[dateNum][n]) rosterMap[dateNum][n] = {};
                                    rosterMap[dateNum][n][turnoLetra] = opObj;
                                }
                            });
                        }
                    }
                }
            }

            // 2. DOS PASADAS PARA ENCONTRAR EL "DÍA ANTERIOR" REAL
            let allValidDates = new Set();
            let rawEffData = [];

            if (effData && effData.length > 0) {
                let isEffObj = !Array.isArray(effData[0]);
                let eHeaders = [];
                let effStartIndex = 0;
                
                if (isEffObj) { eHeaders = Object.keys(effData[0]); } 
                else {
                    for(let r=0; r < Math.min(5, effData.length); r++) {
                        let rowStr = effData[r].join(" ").toLowerCase();
                        if(rowStr.includes("maquina") || rowStr.includes("turno")) {
                            eHeaders = effData[r]; effStartIndex = r + 1; break;
                        }
                    }
                }

                for (let i = effStartIndex; i < effData.length; i++) {
                    let row = effData[i];
                    let rClean = {};
                    if (isEffObj) {
                        for (let k in row) rClean[String(k).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s/g, "")] = row[k];
                    } else {
                        for (let j = 0; j < eHeaders.length; j++) rClean[String(eHeaders[j]).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s/g, "")] = row[j];
                    }

                    const getCol = (keywords) => {
                        for (let k in rClean) { for(let w of keywords) { if (k.includes(w)) return rClean[k]; } }
                        return null;
                    };

                    let rendRaw = parseRobustFloat(getCol(["disponibilidad", "rendimiento", "eficiencia"]) || (isEffObj ? 0 : row[3]));
                    let calRaw = parseRobustFloat(getCol(["calidad"]) || (isEffObj ? 0 : row[4]));
                    let tno = String(getCol(["turno"]) || (isEffObj ? '' : row[1]) || "").trim().toUpperCase();
                    let maqStr = String(getCol(["maquina", "inyectora"]) || (isEffObj ? '' : row[2]) || "").trim();
                    let fechaRaw = getCol(["fecha", "dia", "date"]) || (isEffObj ? '' : row[0]);

                    let recDateNum = normalizeDateToNum(fechaRaw);
                    if (!recDateNum) continue;

                    if (maqStr && tno && (rendRaw > 0 || calRaw > 0)) {
                        let maqNum = parseInt(maqStr.replace(/\D/g, ''), 10);
                        if (isNaN(maqNum)) continue;
                        let letraTurno = tno.includes("MAÑ") ? "M" : (tno.includes("TAR") ? "T" : "N");

                        let rend = (rendRaw <= 1.5 && rendRaw !== 0) ? rendRaw * 100 : rendRaw;
                        let cal = (calRaw <= 1.5 && calRaw !== 0) ? calRaw * 100 : calRaw;
                        let eff = (rend / 100) * (cal / 100) * 100;
                        if (eff > 100) eff = 100.0;

                        allValidDates.add(recDateNum);

                        rawEffData.push({
                            dateNum: recDateNum,
                            maqNum: maqNum,
                            letraTurno: letraTurno,
                            eff: eff,
                            rawCols: rClean
                        });
                    }
                }
            }

            // Descubrir fechas
            let sortedDates = Array.from(allValidDates).sort((a,b) => b - a);
            let latestDateNum = sortedDates.length > 0 ? sortedDates[0] : hoyNum;
            
            // "Día Anterior" es la fecha más reciente que sea MENOR que hoy.
            let pastDates = sortedDates.filter(d => d < hoyNum);
            let diaAnteriorNum = pastDates.length > 0 ? pastDates[0] : null;
            let diaAnteriorStr = diaAnteriorNum ? formatNumToDateStr(diaAnteriorNum) : "SIN DATOS";

            // Título General (Cambia según la pantalla)
            if(currentView === 'operadores') document.getElementById('dynamicMainTitle').innerText = 'TOP OPERADORES - PLANTA';
            else if(currentView === 'lideres') document.getElementById('dynamicMainTitle').innerText = 'RENDIMIENTO LÍDERES DE TURNO';
            else if(currentView === 'maquinas') document.getElementById('dynamicMainTitle').innerText = 'RANKING POR MÁQUINA';

            document.getElementById('fechaHoy').innerText = `SISTEMA ACTIVO: ${formatNumToDateStr(latestDateNum)}`;

            // ACUMULADORES (Día Anterior, Semana, Mes, Global)
            let opStats = { ayer: {}, semana: {}, mes: {}, global: {} };
            let teamStats = { ayer: {}, semana: {}, mes: {}, global: {} };
            let maqStats = { ayer: {}, semana: {}, mes: {}, global: {} };

            const addObjStat = (dict, key, eff, obj) => {
                if(!dict[key]) dict[key] = {sum:0, count:0, obj:obj};
                dict[key].sum += eff; dict[key].count++;
            };

            const addMaqStat = (timeframe, maq, opName, eff, obj) => {
                if(!maqStats[timeframe][maq]) maqStats[timeframe][maq] = {};
                if(!maqStats[timeframe][maq][opName]) maqStats[timeframe][maq][opName] = {sum:0, count:0, obj:obj};
                maqStats[timeframe][maq][opName].sum += eff;
                maqStats[timeframe][maq][opName].count++;
            };

            // 3. SEGUNDA PASADA: ACUMULAR EN LOS 4 PERIODOS
            rawEffData.forEach(item => {
                let opObj = null;
                for(let key in item.rawCols) {
                    let match = identifyPerson(item.rawCols[key]);
                    if (match) { opObj = match; break; }
                }
                if (!opObj && rosterMap[item.dateNum] && rosterMap[item.dateNum][item.maqNum] && rosterMap[item.dateNum][item.maqNum][item.letraTurno]) {
                    opObj = rosterMap[item.dateNum][item.maqNum][item.letraTurno];
                }

                if(opObj) {
                    let recYM = Math.floor(item.dateNum / 100);
                    
                    // GLOBAL
                    addObjStat(opStats.global, opObj.name, item.eff, opObj);
                    addObjStat(teamStats.global, opObj.team, item.eff, opObj);
                    addMaqStat('global', item.maqNum, opObj.name, item.eff, opObj);

                    // MES
                    if (recYM === currentYM) {
                        addObjStat(opStats.mes, opObj.name, item.eff, opObj);
                        addObjStat(teamStats.mes, opObj.team, item.eff, opObj);
                        addMaqStat('mes', item.maqNum, opObj.name, item.eff, opObj);
                    }

                    // SEMANA (Últimos 7 días)
                    if (item.dateNum >= hace7Num) {
                        addObjStat(opStats.semana, opObj.name, item.eff, opObj);
                        addObjStat(teamStats.semana, opObj.team, item.eff, opObj);
                        addMaqStat('semana', item.maqNum, opObj.name, item.eff, opObj);
                    }

                    // DÍA ANTERIOR
                    if (item.dateNum === diaAnteriorNum) {
                        addObjStat(opStats.ayer, opObj.name, item.eff, opObj);
                        addObjStat(teamStats.ayer, opObj.team, item.eff, opObj);
                        addMaqStat('ayer', item.maqNum, opObj.name, item.eff, opObj);
                    }
                }
            });

            // Guardar para render
            globalDataCache = {
                diaAnteriorStr: diaAnteriorStr,
                opStats: opStats,
                teamStats: teamStats,
                maqStats: maqStats,
                machineKeys: Object.keys(maqStats.global).map(Number).sort((a,b)=>a-b)
            };

            renderCurrentView();
            document.getElementById('loader').style.display = 'none';
        }

        // =========================================================
        // MOTOR DE RENDERIZADO DE CUADRANTES
        // =========================================================
        const getTopList = (dict, limit) => {
            let arr = [];
            for(let key in dict) arr.push({ name: key, eff: dict[key].sum / dict[key].count, obj: dict[key].obj });
            return arr.sort((a,b) => b.eff - a.eff).slice(0, limit);
        };

        function renderQuadrant(title, subtitle, list, isTeamMode) {
            let html = `
            <div class="quadrant">
                <div class="q-header">
                    <h2 class="q-title">${title}</h2>
                    <div class="q-subtitle">${subtitle}</div>
                </div>
                <div class="q-body">`;
            
            if (list.length === 0) {
                html += `<div class="empty-state"><span style="font-size:3vh;">📊</span><p style="font-size:1.5vh;">SIN DATOS</p></div>`;
            } else {
                let medals = ['🥇', '🥈', '🥉', '4°', '5°'];
                list.forEach((item, index) => {
                    let scoreText = item.eff.toFixed(1).replace('.',',') + '%';
                    let colorClass = isTeamMode ? item.obj.tClass : `fill-${index+1}`;
                    let colorNombre = (index === 0 && !isTeamMode) ? 'var(--gold)' : (isTeamMode ? item.obj.tColor : '#222');
                    if (isTeamMode && index > 0) colorNombre = '#222';
                    
                    html += `
                    <div class="bar-row">
                        <div class="bar-info">
                            <div class="bar-rank-name">
                                <span class="bar-medal" style="font-size:2vh; width:3vh;">${medals[index] || ''}</span>
                                <span style="color: ${colorNombre}; font-size:1.8vh;">${item.name}</span>
                            </div>
                            <div class="bar-score" style="color: ${colorNombre}; font-size:2vh;">${scoreText}</div>
                        </div>
                        <div class="bar-track" style="height:1.5vh;">
                            <div class="bar-fill ${colorClass}" style="width: ${item.eff > 100 ? 100 : item.eff}%"></div>
                        </div>
                    </div>`;
                });
            }
            html += `</div></div>`;
            return html;
        }

        function renderCurrentView() {
            let grid = document.getElementById('mainGrid');
            let cache = globalDataCache;
            let html = '';

            if (currentView === 'operadores') {
                html += renderQuadrant("DÍA ANTERIOR", cache.diaAnteriorStr, getTopList(cache.opStats.ayer, 5), false);
                html += renderQuadrant("ÚLTIMOS 7 DÍAS", "EVALUACIÓN SEMANAL", getTopList(cache.opStats.semana, 5), false);
                html += renderQuadrant("MES ACTUAL", "EVALUACIÓN MENSUAL", getTopList(cache.opStats.mes, 5), false);
                html += renderQuadrant("HISTÓRICO GLOBAL", "EVALUACIÓN GENERAL", getTopList(cache.opStats.global, 5), false);
                grid.innerHTML = html;
            } 
            else if (currentView === 'lideres') {
                html += renderQuadrant("LÍDERES: DÍA ANTERIOR", cache.diaAnteriorStr, getTopList(cache.teamStats.ayer, 3), true);
                html += renderQuadrant("LÍDERES: ÚLTIMOS 7 DÍAS", "EVALUACIÓN SEMANAL", getTopList(cache.teamStats.semana, 3), true);
                html += renderQuadrant("LÍDERES: MES ACTUAL", "EVALUACIÓN MENSUAL", getTopList(cache.teamStats.mes, 3), true);
                html += renderQuadrant("LÍDERES: GLOBAL", "EVALUACIÓN GENERAL", getTopList(cache.teamStats.global, 3), true);
                grid.innerHTML = html;
            }
            else if (currentView === 'maquinas') {
                if (cache.machineKeys.length === 0) {
                    grid.innerHTML = `<div class="empty-state" style="grid-column: span 2;"><span>⏳</span><p>SIN MÁQUINAS REGISTRADAS</p></div>`;
                    return;
                }
                
                let currentMaqIndex = 0;
                
                const updateMachineGrid = () => {
                    let m = cache.machineKeys[currentMaqIndex];
                    document.getElementById('dynamicMainTitle').innerText = `MÁQUINA ${m} - RANKING OPERADORES`;
                    
                    let mqHtml = '';
                    mqHtml += renderQuadrant("MÁQUINA " + m + " - DÍA ANTERIOR", cache.diaAnteriorStr, getTopList(cache.maqStats.ayer[m] || {}, 5), false);
                    mqHtml += renderQuadrant("MÁQUINA " + m + " - 7 DÍAS", "EVALUACIÓN SEMANAL", getTopList(cache.maqStats.semana[m] || {}, 5), false);
                    mqHtml += renderQuadrant("MÁQUINA " + m + " - MES", "EVALUACIÓN MENSUAL", getTopList(cache.maqStats.mes[m] || {}, 5), false);
                    mqHtml += renderQuadrant("MÁQUINA " + m + " - GLOBAL", "EVALUACIÓN GENERAL", getTopList(cache.maqStats.global[m] || {}, 5), false);
                    grid.innerHTML = mqHtml;

                    // Forzar animación
                    setTimeout(() => {
                        grid.querySelectorAll('.bar-fill').forEach(b => {
                            b.style.width = b.parentElement.innerHTML.match(/width:\s*([^%]+)%/)[1] + '%';
                        });
                    }, 100);

                    currentMaqIndex = (currentMaqIndex + 1) % cache.machineKeys.length;
                };

                updateMachineGrid();
                clearInterval(maqInterval);
                maqInterval = setInterval(updateMachineGrid, 8000); // Rota de máquina cada 8 segundos
            }
            
            // Iniciar animaciones de carga para estáticos
            if(currentView !== 'maquinas') {
                setTimeout(() => {
                    grid.querySelectorAll('.bar-fill').forEach(b => {
                        b.style.width = b.parentElement.innerHTML.match(/width:\s*([^%]+)%/)[1] + '%';
                    });
                }, 100);
            }
        }

        window.onload = startEngine;
        setInterval(startEngine, 300000); 
    </script>
</body>
</html>
