<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libus - Control de Eficiencia por Turno</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #e60050; --dark: #1a1e23; --light: #f4f6f9; --green: #28a745; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--light); color: #333; }
        header { background: var(--dark); padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .logo { height: 40px; }
        .nav-btns button { background: none; border: 1px solid white; color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-left: 10px; font-weight: bold; transition: 0.3s; }
        .nav-btns button:hover { background: white; color: var(--dark); }
        .view { display: none; padding: 20px; max-width: 1200px; margin: auto; }
        .view.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Formularios (Modo Operador) */
        .form-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #555; text-transform: uppercase;}
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px;}
        .btn-submit { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px;}
        .btn-submit:hover { background: #c20042; }
        
        /* Dashboard TV (Modo Yodeck) */
        .dashboard-tv { background-color: #0b0f19; color: white; min-height: 100vh; padding: 20px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: #1a2235; border-left: 5px solid var(--primary); padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .kpi-card h3 { margin: 0; font-size: 13px; color: #a0aec0; text-transform: uppercase; }
        .kpi-card p { margin: 10px 0 0; font-size: 38px; font-weight: bold; }
        .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; }
        .chart-box { background: #1a2235; padding: 20px; border-radius: 8px; height: 320px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* Loader */
        #loader { display: none; text-align: center; padding: 20px; font-weight: bold; color: var(--primary); font-size: 16px;}
    </style>
</head>
<body>

    <!-- CONEXIÓN AL BACKEND DE GOOGLE SHEETS -->
    <script>const API_URL = "https://script.google.com/macros/s/AKfycbytlOmX-j60FU_uiCd-RS8KWeJewQ6I6AXFPZoc0glnqRAPQs3dqqH0XJ_NOCDiYrI/exec";</script>

    <header id="main-header">
        <img src="https://latam.libus.com/imagenes/logo_libus.png" alt="Libus" class="logo">
        <div class="nav-btns">
            <button onclick="switchView('form-view')">📱 Ingreso Operador</button>
            <button onclick="switchView('dash-view'); loadDashboard();">📺 Pantalla TV (Yodeck)</button>
        </div>
    </header>

    <div id="loader">Conectando con la base de datos... ⏳</div>

    <!-- VISTA 1: FORMULARIO MÓVIL (Operadores) -->
    <div id="form-view" class="view active">
        <div class="form-container">
            <h2 style="text-align: center; margin-top: 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px;">Registro de Producción</h2>
            <form id="prodForm" onsubmit="submitForm(event)">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div class="form-group">
                        <label>Turno</label>
                        <select id="turno" required>
                            <option value="Mañana">Mañana (420 min)</option>
                            <option value="Tarde">Tarde (480 min)</option>
                            <option value="Noche">Noche (540 min)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Máquina</label>
                    <select id="maquina" required>
                        <option value="Inyectora 1">Inyectora 1</option>
                        <option value="Inyectora 2">Inyectora 2</option>
                        <option value="Inyectora 3">Inyectora 3</option>
                        <option value="Inyectora 4">Inyectora 4</option>
                        <option value="Inyectora 5">Inyectora 5</option>
                        <option value="Inyectora 6">Inyectora 6</option>
                        <option value="Inyectora 7">Inyectora 7</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f8f9fa; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
                    <div class="form-group" style="margin-bottom: 0;"><label>Contador Inicio</label><input type="number" id="contIn" required step="1"></div>
                    <div class="form-group" style="margin-bottom: 0;"><label>Contador Fin</label><input type="number" id="contFin" required step="1"></div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group"><label>Cavidades</label><input type="number" id="cavidades" required step="1" min="1"></div>
                    <div class="form-group"><label>Ciclo Real (s)</label><input type="number" id="ciclo" required step="0.01"></div>
                </div>

                <div class="form-group" style="border-left: 4px solid #dc3545; padding-left: 10px;">
                    <label style="color: #dc3545;">Unidades Malas (Scrap)</label>
                    <input type="number" id="malas" required step="1" min="0" placeholder="Ej: 15">
                </div>
                
                <button type="submit" class="btn-submit">Subir Datos a la Nube ☁️</button>
            </form>
        </div>
    </div>

    <!-- VISTA 2: DASHBOARD TV (Yodeck) -->
    <div id="dash-view" class="view dashboard-tv">
        <h2 style="text-align: center; margin-top: 0; color: white; letter-spacing: 2px;">PANEL DE EFICIENCIA - TIEMPO REAL</h2>
        
        <div class="kpi-grid">
            <div class="kpi-card"><h3>Eficiencia Global (OEE)</h3><p id="kpi-eff" style="color: #28a745;">0%</p></div>
            <div class="kpi-card"><h3>Disponibilidad (Prom)</h3><p id="kpi-disp" style="color: #007bff;">0%</p></div>
            <div class="kpi-card"><h3>Calidad (Prom)</h3><p id="kpi-cal" style="color: #ffc107;">0%</p></div>
            <div class="kpi-card"><h3>Total Piezas Inyectadas</h3><p id="kpi-pzas" style="color: white;">0</p></div>
        </div>

        <div class="chart-grid">
            <div class="chart-box"><canvas id="chartShift"></canvas></div>
            <div class="chart-box"><canvas id="chartMachine"></canvas></div>
        </div>
    </div>

    <script>
        let chartShiftObj = null; 
        let chartMachineObj = null;

        // Auto-detectar si está en Yodeck (?view=tv en la URL)
        window.onload = () => {
            document.getElementById('fecha').valueAsDate = new Date();
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('view') === 'tv') {
                document.getElementById('main-header').style.display = 'none'; // Oculta barra superior en la TV
                switchView('dash-view');
                loadDashboard();
                setInterval(loadDashboard, 300000); // Refresco automático cada 5 minutos
            }
        };

        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'dash-view') document.body.style.backgroundColor = "#0b0f19";
            else document.body.style.backgroundColor = "var(--light)";
        }

        // --- 1. ENVIAR DATOS A GOOGLE SHEETS (Frontend -> Backend) ---
        function submitForm(e) {
            e.preventDefault();
            document.getElementById('loader').style.display = 'block';
            
            const payload = {
                fecha: document.getElementById('fecha').value,
                turno: document.getElementById('turno').value,
                maquina: document.getElementById('maquina').value,
                contInicial: document.getElementById('contIn').value,
                contFinal: document.getElementById('contFin').value,
                cavidades: document.getElementById('cavidades').value,
                ciclo: document.getElementById('ciclo').value,
                malas: document.getElementById('malas').value
            };

            // Se usa no-cors y text/plain para evitar bloqueos del navegador al enviar a Google Scripts
            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).then(() => {
                document.getElementById('loader').style.display = 'none';
                alert("✅ Registro guardado con éxito.");
                document.getElementById('prodForm').reset();
                document.getElementById('fecha').valueAsDate = new Date();
            }).catch(err => {
                document.getElementById('loader').style.display = 'none';
                alert("❌ Hubo un error de conexión al guardar.");
            });
        }

        // --- 2. LEER DATOS Y GENERAR DASHBOARD (Backend -> Frontend) ---
        async function loadDashboard() {
            try {
                document.getElementById('loader').style.display = 'block';
                const response = await fetch(API_URL);
                const data = await response.json();
                document.getElementById('loader').style.display = 'none';
                
                if(data.length === 0) return;

                // Extraer Data y calcular promedios
                let tEff=0, tDisp=0, tCal=0, tPzas=0, validRows=0;
                let dataShift = {"Mañana": [], "Tarde": [], "Noche": []};
                let dataMaq = {};

                data.forEach(row => {
                    // Adaptamos a los nombres de las columnas en tu Sheet
                    let eff = parseFloat(row["Eficiencia"] || row["eficiencia"]) || 0;
                    let disp = parseFloat(row["Disponibilidad"] || row["disponibilidad"]) || 0;
                    let cal = parseFloat(row["Calidad"] || row["calidad"]) || 0;
                    
                    let pzas = parseFloat(row["Cantidad Inyectada"] || row["inyectada"] || row["Cantidad"]) || 0; 
                    
                    let tno = row["Turno"] || row["turno"];
                    let maq = row["Máquina"] || row["Maquina"] || row["maquina"];

                    tPzas += pzas;
                    
                    if(eff > 0 || disp > 0) { 
                        tEff += eff; 
                        tDisp += disp; 
                        tCal += cal; 
                        validRows++; 
                    }
                    
                    if(tno && dataShift[tno]) dataShift[tno].push(eff);
                    if(maq) {
                        if(!dataMaq[maq]) dataMaq[maq] = [];
                        dataMaq[maq].push(eff);
                    }
                });

                // Inyectar KPIs a la pantalla
                if(validRows > 0) {
                    // Si los valores llegan en formato decimal (ej: 0.85 en lugar de 85), los multiplicamos
                    let isDecimal = tEff / validRows < 2; 
                    let multiplier = isDecimal ? 100 : 1;

                    document.getElementById('kpi-eff').innerText = ((tEff/validRows)*multiplier).toFixed(1) + "%";
                    document.getElementById('kpi-disp').innerText = ((tDisp/validRows)*multiplier).toFixed(1) + "%";
                    document.getElementById('kpi-cal').innerText = ((tCal/validRows)*multiplier).toFixed(1) + "%";
                }
                document.getElementById('kpi-pzas').innerText = tPzas.toLocaleString('es-ES');

                // Graficar
                const avg = arr => arr.length > 0 ? (arr.reduce((a,b)=>a+b,0)/arr.length) * (arr[0] <= 1 ? 100 : 1) : 0;
                
                // Gráfico 1: Eficiencia por Turno
                const shiftLabels = ["Mañana", "Tarde", "Noche"];
                const shiftData = [avg(dataShift["Mañana"]), avg(dataShift["Tarde"]), avg(dataShift["Noche"])];
                
                if(chartShiftObj) chartShiftObj.destroy();
                chartShiftObj = new Chart(document.getElementById('chartShift'), {
                    type: 'bar',
                    data: { labels: shiftLabels, datasets: [{ label: 'Eficiencia % (OEE) por Turno', data: shiftData, backgroundColor: '#e60050' }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { max: 110, grid: {color: '#2d3748'}, ticks: {color:'#a0aec0'} }, x: {ticks:{color:'#a0aec0'}} }, plugins: { legend: { labels: { color: 'white' } } } }
                });

                // Gráfico 2: Eficiencia por Máquina
                const maqLabels = Object.keys(dataMaq).sort();
                const maqData = maqLabels.map(m => avg(dataMaq[m]));

                if(chartMachineObj) chartMachineObj.destroy();
                chartMachineObj = new Chart(document.getElementById('chartMachine'), {
                    type: 'line',
                    data: { labels: maqLabels, datasets: [{ label: 'Eficiencia % (OEE) por Máquina', data: maqData, borderColor: '#007bff', backgroundColor: 'rgba(0,123,255,0.2)', fill: true, tension: 0.3, borderWidth: 3 }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { max: 110, grid: {color: '#2d3748'}, ticks:{color:'#a0aec0'} }, x: {ticks:{color:'#a0aec0'}} }, plugins: { legend: { labels: { color: 'white' } } } }
                });

            } catch(e) {
                console.error("Error al cargar datos del Dashboard", e);
            }
        }
    </script>
</body>
</html>
