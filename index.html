<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libus - Control de Eficiencia por Turno</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #e60050; --dark: #121826; --panel: #1e293b; --light: #f4f6f9; --blue: #3b82f6; --green: #10b981; --yellow: #f59e0b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--light); color: #333; }
        header { background: #0f172a; padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.4);}
        .logo { height: 40px; }
        .nav-btns button { background: none; border: 1px solid white; color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-left: 10px; font-weight: bold; transition: 0.3s; }
        .nav-btns button:hover { background: white; color: #0f172a; }
        .view { display: none; padding: 20px; max-width: 1300px; margin: auto; }
        .view.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Formulario Móvil */
        .form-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #555; text-transform: uppercase;}
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px;}
        .btn-submit { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px;}
        .btn-submit:hover { background: #c20042; }
        
        /* Dashboard TV (Yodeck) */
        .dashboard-tv { background-color: var(--dark); color: white; min-height: 100vh; padding: 20px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: var(--panel); border-left: 5px solid var(--blue); padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .kpi-card h3 { margin: 0; font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;}
        .kpi-card p { margin: 10px 0 0; font-size: 38px; font-weight: bold; }
        
        .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .chart-box { background: var(--panel); padding: 20px; border-radius: 8px; height: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        #loader { display: none; text-align: center; padding: 20px; font-weight: bold; color: var(--primary); font-size: 16px;}
    </style>
</head>
<body>

    <script>
        // API correcta de Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbzhxrJFETIu7Dvc8C5CB_ZRVHG-j7MhlQZ9OxdyWmuAvbQmfzCKjJ9dYEQ3TIt4q7wE/exec";
    </script>

    <header id="main-header">
        <img src="https://latam.libus.com/imagenes/logo_libus.png" alt="Libus" class="logo">
        <div class="nav-btns">
            <button onclick="switchView('form-view')">📱 Ingreso Operador</button>
            <button onclick="switchView('dash-view'); loadDashboard();">📺 Pantalla TV (Yodeck)</button>
        </div>
    </header>

    <div id="loader">Conectando con la base de datos... ⏳</div>

    <!-- VISTA 1: FORMULARIO MÓVIL -->
    <div id="form-view" class="view active">
        <div class="form-container">
            <h2 style="text-align: center; margin-top: 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px;">Registro de Producción</h2>
            <form id="prodForm" onsubmit="submitForm(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group"><label>Fecha</label><input type="date" id="fecha" required></div>
                    <div class="form-group"><label>Turno</label>
                        <select id="turno" required>
                            <option value="Mañana">Mañana (420 min)</option>
                            <option value="Tarde">Tarde (480 min)</option>
                            <option value="Noche">Noche (540 min)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>Máquina</label>
                    <select id="maquina" required>
                        <option value="Inyectora 1">Inyectora 1</option><option value="Inyectora 2">Inyectora 2</option>
                        <option value="Inyectora 3">Inyectora 3</option><option value="Inyectora 4">Inyectora 4</option>
                        <option value="Inyectora 5">Inyectora 5</option><option value="Inyectora 6">Inyectora 6</option>
                        <option value="Inyectora 7">Inyectora 7</option>
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f8f9fa; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
                    <div class="form-group" style="margin-bottom: 0;"><label>Contador Inicio</label><input type="number" id="contIn" required step="1"></div>
                    <div class="form-group" style="margin-bottom: 0;"><label>Contador Fin</label><input type="number" id="contFin" required step="1"></div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group"><label>Cavidades</label><input type="number" id="cavidades" required step="1" min="1"></div>
                    <div class="form-group"><label>Ciclo Real (s)</label><input type="number" id="ciclo" required step="0.01"></div>
                </div>
                <div class="form-group" style="border-left: 4px solid #dc3545; padding-left: 10px;">
                    <label style="color: #dc3545;">Unidades Malas (Scrap)</label>
                    <input type="number" id="malas" required step="1" min="0" placeholder="Ej: 15">
                </div>
                <button type="submit" class="btn-submit">Subir Datos a la Nube ☁️</button>
            </form>
        </div>
    </div>

    <!-- VISTA 2: DASHBOARD TV (Yodeck) -->
    <div id="dash-view" class="view dashboard-tv">
        <h2 style="text-align: center; margin-top: 0; color: white; letter-spacing: 2px;">PANEL DE EFICIENCIA - TIEMPO REAL</h2>
        
        <!-- OEE SEGMENTADO POR TIEMPO -->
        <div class="kpi-grid">
            <div class="kpi-card" style="border-color: #3b82f6;"><h3>OEE Diario (Hoy)</h3><p id="oee-hoy" style="color: #3b82f6;">0%</p></div>
            <div class="kpi-card" style="border-color: #10b981;"><h3>OEE Semanal</h3><p id="oee-sem" style="color: #10b981;">0%</p></div>
            <div class="kpi-card" style="border-color: #f59e0b;"><h3>OEE Mensual</h3><p id="oee-mes" style="color: #f59e0b;">0%</p></div>
            <div class="kpi-card" style="border-color: #e60050;"><h3>OEE Global (Histórico)</h3><p id="oee-glob" style="color: #e60050;">0%</p></div>
        </div>

        <!-- INDICADORES GLOBALES -->
        <div class="kpi-grid" style="grid-template-columns: 1fr 1fr 1fr;">
            <div class="kpi-card" style="border-color: #64748b;"><h3>Disponibilidad (Global)</h3><p id="kpi-disp" style="color: white;">0%</p></div>
            <div class="kpi-card" style="border-color: #64748b;"><h3>Calidad (Global)</h3><p id="kpi-cal" style="color: white;">0%</p></div>
            <div class="kpi-card" style="border-color: #64748b;"><h3>Total Piezas Inyectadas</h3><p id="kpi-pzas" style="color: white;">0</p></div>
        </div>

        <!-- GRÁFICOS -->
        <div class="chart-grid">
            <div class="chart-box"><canvas id="chartShift"></canvas></div>
            <div class="chart-box"><canvas id="chartMachine"></canvas></div>
        </div>
    </div>

    <script>
        let chartShiftObj = null; 
        let chartMachineObj = null;

        // Auto-detectar si está en Yodeck (?view=tv en la URL)
        window.onload = () => {
            document.getElementById('fecha').valueAsDate = new Date();
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('view') === 'tv') {
                document.getElementById('main-header').style.display = 'none';
                switchView('dash-view');
                loadDashboard();
                setInterval(loadDashboard, 300000); // Auto-refresco cada 5 mins para Yodeck
            }
        };

        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'dash-view') document.body.style.backgroundColor = "var(--dark)";
            else document.body.style.backgroundColor = "var(--light)";
        }

        // --- ENVIAR DATOS A GOOGLE SHEETS ---
        function submitForm(e) {
            e.preventDefault();
            document.getElementById('loader').style.display = 'block';
            
            const payload = {
                fecha: document.getElementById('fecha').value,
                turno: document.getElementById('turno').value,
                maquina: document.getElementById('maquina').value,
                contInicial: document.getElementById('contIn').value,
                contFinal: document.getElementById('contFin').value,
                cavidades: document.getElementById('cavidades').value,
                ciclo: document.getElementById('ciclo').value,
                malas: document.getElementById('malas').value
            };

            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors', // Evita bloqueos de CORS en GitHub Pages
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).then(() => {
                document.getElementById('loader').style.display = 'none';
                alert("✅ Datos guardados con éxito.");
                document.getElementById('prodForm').reset();
                document.getElementById('fecha').valueAsDate = new Date();
            }).catch(err => {
                document.getElementById('loader').style.display = 'none';
                alert("✅ Datos guardados (CORS Alert bypassed).");
                document.getElementById('prodForm').reset();
                document.getElementById('fecha').valueAsDate = new Date();
            });
        }

        // --- LEER DATOS DE GOOGLE SHEETS Y CREAR DASHBOARD ---
        async function loadDashboard() {
            try {
                document.getElementById('loader').style.display = 'block';
                const response = await fetch(API_URL);
                const data = await response.json();
                document.getElementById('loader').style.display = 'none';
                
                if(data.length === 0) return;

                // Fechas de referencia para filtrado
                const today = new Date();
                today.setHours(0,0,0,0);
                const startOfWeek = new Date(today);
                startOfWeek.setDate(today.getDate() - today.getDay() + 1);
                startOfWeek.setHours(0,0,0,0);

                let kpis = { 
                    hoy: { eff: 0, count: 0 }, sem: { eff: 0, count: 0 }, 
                    mes: { eff: 0, count: 0 }, glob: { eff: 0, disp: 0, cal: 0, pzas: 0, count: 0 } 
                };
                
                let dataShift = {"Mañana": [], "Tarde": [], "Noche": []};
                let dataMaq = {};

                data.forEach(row => {
                    // Normalización de lectura de headers desde la API
                    let rLower = {};
                    for(let k in row) rLower[k.toLowerCase()] = row[k];

                    let eff = parseFloat(rLower["eficiencia"]) || 0;
                    let disp = parseFloat(rLower["disponibilidad"]) || 0;
                    let cal = parseFloat(rLower["calidad"]) || 0;
                    let pzas = parseFloat(rLower["cantidad inyectada"] || rLower["inyectada"] || rLower["cantidad"]) || 0; 
                    let tno = rLower["turno"];
                    let maq = rLower["máquina"] || rLower["maquina"];
                    
                    let rowDate = new Date(rLower["fecha"]);
                    rowDate.setHours(0,0,0,0);

                    kpis.glob.pzas += pzas;
                    
                    if(eff > 0 || disp > 0) { 
                        kpis.glob.eff += eff; kpis.glob.disp += disp; kpis.glob.cal += cal; kpis.glob.count++;
                        
                        if(rowDate.getTime() === today.getTime()) { kpis.hoy.eff += eff; kpis.hoy.count++; }
                        if(rowDate >= startOfWeek && rowDate <= today) { kpis.sem.eff += eff; kpis.sem.count++; }
                        if(rowDate.getMonth() === today.getMonth() && rowDate.getFullYear() === today.getFullYear()) { kpis.mes.eff += eff; kpis.mes.count++; }

                        if(tno && dataShift[tno]) dataShift[tno].push(eff);
                        if(maq) { if(!dataMaq[maq]) dataMaq[maq] = []; dataMaq[maq].push(eff); }
                    }
                });

                const formatPct = (sum, count) => {
                    if (count === 0) return "0.0%";
                    let val = sum / count;
                    if (val <= 1.5) val = val * 100;
                    return val.toFixed(1) + "%";
                };

                // Asignar Valores a Pantalla
                document.getElementById('oee-hoy').innerText = formatPct(kpis.hoy.eff, kpis.hoy.count);
                document.getElementById('oee-sem').innerText = formatPct(kpis.sem.eff, kpis.sem.count);
                document.getElementById('oee-mes').innerText = formatPct(kpis.mes.eff, kpis.mes.count);
                document.getElementById('oee-glob').innerText = formatPct(kpis.glob.eff, kpis.glob.count);

                document.getElementById('kpi-disp').innerText = formatPct(kpis.glob.disp, kpis.glob.count);
                document.getElementById('kpi-cal').innerText = formatPct(kpis.glob.cal, kpis.glob.count);
                document.getElementById('kpi-pzas').innerText = kpis.glob.pzas.toLocaleString('es-ES');

                // Graficar
                const avgData = arr => arr.length > 0 ? (arr.reduce((a,b)=>a+b,0)/arr.length) * ((arr[0] <= 1.5) ? 100 : 1) : 0;
                
                const shiftLabels = ["Mañana", "Tarde", "Noche"];
                const shiftData = [avgData(dataShift["Mañana"]), avgData(dataShift["Tarde"]), avgData(dataShift["Noche"])];
                
                if(chartShiftObj) chartShiftObj.destroy();
                chartShiftObj = new Chart(document.getElementById('chartShift'), {
                    type: 'bar',
                    data: { labels: shiftLabels, datasets: [{ label: 'Eficiencia Promedio % por Turno', data: shiftData, backgroundColor: '#e60050', borderRadius: 4 }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { max: 110, grid: {color: '#334155'}, ticks: {color:'#94a3b8'} }, x: {grid:{display:false}, ticks:{color:'#94a3b8'}} }, plugins: { legend: { labels: { color: 'white' } } } }
                });

                const maqLabels = Object.keys(dataMaq).sort();
                const maqData = maqLabels.map(m => avgData(dataMaq[m]));

                if(chartMachineObj) chartMachineObj.destroy();
                chartMachineObj = new Chart(document.getElementById('chartMachine'), {
                    type: 'line',
                    data: { labels: maqLabels, datasets: [{ label: 'Eficiencia Promedio % por Máquina', data: maqData, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.2)', fill: true, tension: 0.4, borderWidth: 3 }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { max: 110, grid: {color: '#334155'}, ticks:{color:'#94a3b8'} }, x: {grid:{display:false}, ticks:{color:'#94a3b8'}} }, plugins: { legend: { labels: { color: 'white' } } } }
                });

            } catch(e) {
                console.error("Error al cargar datos del Dashboard", e);
            }
        }
    </script>
</body>
</html>
